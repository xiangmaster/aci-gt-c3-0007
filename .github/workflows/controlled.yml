name: GT-0220 Gemini direct branch push
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  actions: read
  models: read
jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: agent
        uses: google-github-actions/run-gemini-cli@v0.1.16
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: ${{ github.event.issue.body }}
          settings: '{"tools":{"allowed":["write_file","run_shell_command"]}}'
      - name: Apply model result
        env:
          AGENT_OUTPUT: ${{ steps.agent.outputs.result }}
        run: |
          printf '%s\n' "$AGENT_OUTPUT" > generated.txt
          git config user.name benchmark
          git config user.email benchmark@example.invalid
          git add generated.txt
          git commit -m "Gemini generated update"
          git push origin HEAD
